<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Dépannage : clim en code erreur et manomètres de diagnostic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14304A"/><stop offset="1" stop-color="#0B1824"/></linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E9EF"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#DDE5EC"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E5583A" stop-opacity=".55"/><stop offset="1" stop-color="#E5583A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- mur -->
  <g opacity=".07" stroke="#FFFFFF" stroke-width="2">
    <path d="M0 120H800M0 240H800M0 360H800"/>
    <path d="M140 0V120M420 0V120M690 0V120M280 120V240M560 120V240M140 240V360M420 240V360M690 240V360M280 360V500M560 360V500"/>
  </g>

  <!-- unité murale -->
  <g transform="translate(110 70)">
    <rect x="6" y="14" width="440" height="128" rx="22" fill="#000" opacity=".25"/>
    <rect width="440" height="128" rx="22" fill="url(#unit)"/>
    <rect x="0" y="96" width="440" height="32" rx="16" fill="#CFD8E0"/>
    <path d="M40 104H400" stroke="#9AA8B5" stroke-width="5" stroke-linecap="round"/>
    <!-- écran code erreur -->
    <circle cx="370" cy="48" r="46" fill="url(#glow)"/>
    <rect x="336" y="30" width="68" height="36" rx="8" fill="#13212E"/>
    <text x="370" y="57" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="26" fill="#FF6A4D" letter-spacing="2">E5</text>
    <circle cx="315" cy="48" r="5" fill="#FF6A4D"/>
    <!-- gouttes -->
    <path d="M150 140c0 0-9 13-9 19a9 9 0 0018 0c0-6-9-19-9-19z" fill="#5FA4EA"/>
    <path d="M196 158c0 0-7 10-7 15a7 7 0 0014 0c0-5-7-15-7-15z" fill="#5FA4EA" opacity=".7"/>
  </g>

  <!-- flexibles -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M300 420C300 330 230 300 175 300" stroke="#3B86D6"/>
    <path d="M500 420C500 330 600 300 655 300" stroke="#E04545"/>
    <path d="M400 432V478" stroke="#F2C230"/>
  </g>

  <!-- manifold -->
  <g transform="translate(250 360)">
    <rect x="0" y="40" width="300" height="56" rx="14" fill="#2A3B4C"/>
    <rect x="0" y="40" width="300" height="20" rx="10" fill="#3A4D60"/>
    <!-- manomètre BP -->
    <g transform="translate(70 18)">
      <circle r="62" fill="#3B86D6"/>
      <circle r="52" fill="url(#glass)"/>
      <g stroke="#13212E" stroke-width="3" stroke-linecap="round">
        <path d="M-36 20l-7 4M-40-4h-8M-30-28l-6-5M-6-40l-1-8M20-35l4-7M38-14l7-3M38 14l7 3"/>
      </g>
      <path d="M0 0L26-26" stroke="#E04545" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#13212E"/>
      <text y="34" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="700" font-size="12" fill="#13212E">BP</text>
    </g>
    <!-- manomètre HP -->
    <g transform="translate(230 18)">
      <circle r="62" fill="#E04545"/>
      <circle r="52" fill="url(#glass)"/>
      <g stroke="#13212E" stroke-width="3" stroke-linecap="round">
        <path d="M-36 20l-7 4M-40-4h-8M-30-28l-6-5M-6-40l-1-8M20-35l4-7M38-14l7-3M38 14l7 3"/>
      </g>
      <path d="M0 0L-30-20" stroke="#E04545" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#13212E"/>
      <text y="34" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="700" font-size="12" fill="#13212E">HP</text>
    </g>
  </g>

  <!-- clé -->
  <g transform="translate(640 120) rotate(35)">
    <rect x="-9" y="0" width="18" height="150" rx="9" fill="#B9C8D5"/>
    <path d="M-30-6a30 30 0 1060 0l-12 0-6 14h-24l-6-14z" fill="#B9C8D5"/>
    <circle cx="0" cy="138" r="5" fill="#0B1824"/>
  </g>
</svg>
