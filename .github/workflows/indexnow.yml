name: IndexNow

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Attendre la publication du site
        run: sleep 90
      - name: Envoyer les pages à IndexNow
        run: node scripts/indexnow.mjs
