name: Avis Google

on:
  schedule:
    - cron: "17 4 * * *"   # chaque nuit vers 6h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main
  push:                     # se lance aussi quand le robot est mis à jour
    branches: [main]
    paths:
      - "scripts/avis-google.mjs"
      - ".github/workflows/avis-google.yml"

permissions:
  contents: write

jobs:
  maj-avis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les avis
        run: node scripts/avis-google.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "thermaz-bot"
          git config user.email "thermaz-bot@users.noreply.github.com"
          git add data/avis-google.json
          if git diff --cached --ignore-matching-lines='"updated"' --quiet; then
            echo "Aucun nouvel avis."
          else
            git commit -m "Mise à jour des avis Google"
            git push
          fi
